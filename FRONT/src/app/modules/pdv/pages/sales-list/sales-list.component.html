<div class="sales-list">
  <div class="header">
    <h3>Vendas (recentes)</h3>
    <div class="filters">
      <ejs-daterangepicker [(ngModel)]="range" placeholder="Período"></ejs-daterangepicker>
      <ejs-dropdownlist [dataSource]="statusOptions" [fields]="{ text: 'text', value: 'value' }" [(ngModel)]="status" width="160" placeholder="Status"></ejs-dropdownlist>
      <button ejs-button cssClass="e-primary" (click)="load()" [disabled]="loading">Aplicar</button>
    </div>
  </div>

  <div class="alert" *ngIf="mensagem" [class.success]="mensagem.tipo === 'success'" [class.error]="mensagem.tipo === 'error'" style="margin-bottom: 12px; padding: 10px 14px; border-radius: 8px; font-size: 13px; display: flex; justify-content: space-between; align-items: center;">
    <span>{{ mensagem.texto }}</span>
    <button (click)="limparMensagem()" style="background: none; border: none; font-size: 16px; cursor: pointer;">×</button>
  </div>

  <ejs-grid [dataSource]="vendas" height="400" [allowFiltering]="true" [filterSettings]="{ type: 'Menu' }">
    <e-columns>
      <e-column field="id" headerText="ID" width="90" textAlign="Right"></e-column>
      <e-column field="dataVenda" headerText="Data" width="180" type="dateTime" format="dd/MM/y HH:mm"></e-column>
      <e-column field="status" headerText="Status" width="120"></e-column>
      <e-column field="valorBruto" headerText="Bruto" width="120" format="C2" textAlign="Right"></e-column>
      <e-column field="desconto" headerText="Desc" width="100" format="C2" textAlign="Right"></e-column>
      <e-column field="valorLiquido" headerText="Líquido" width="130" format="C2" textAlign="Right"></e-column>
      <e-column headerText="Ações" width="320" [template]="actionTpl"></e-column>
    </e-columns>
    <ng-template #actionTpl let-data>
      <a [routerLink]="['/pdv']" [queryParams]="{ id: data.id }" ejs-button class="e-flat e-small">Editar</a>
      <a [routerLink]="['/pdv/vendas', data.id, 'cupom']" target="_blank" ejs-button class="e-flat e-small">Imprimir</a>
      <button *ngIf="data.status === 'Finalizada'" ejs-button class="e-flat e-small e-primary" (click)="emitirNfce(data)">📄 Emitir NFC-e</button>
      <button *ngIf="data.status !== 'Cancelada'" ejs-button class="e-flat e-small" (click)="cancelarVenda(data)">Cancelar</button>
    </ng-template>
  </ejs-grid>
</div>
