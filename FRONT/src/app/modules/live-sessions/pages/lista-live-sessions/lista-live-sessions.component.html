<div class="dashboard-container">
  <div class="summary-cards">
    <mat-card class="summary-card">
      <div class="summary-title">Sessões de live</div>
      <div class="summary-value">{{ totalSessions }}</div>
    </mat-card>
    <mat-card class="summary-card">
      <div class="summary-title">Comentários recebidos</div>
      <div class="summary-value">{{ totalComentarios }}</div>
    </mat-card>
  </div>

  <div class="sessions-list">
    <div class="sessions-header">
      <h2>Lives do Instagram</h2>
      <button (click)="carregar()" title="Atualizar lista">Atualizar</button>
    </div>

    <div class="loading-overlay" *ngIf="carregando">Carregando sessões...</div>

    <ejs-grid
      *ngIf="!carregando"
      [dataSource]="sessions"
      [allowPaging]="true"
      [allowSorting]="true"
      [pageSettings]="pageSettings"
      (rowSelected)="onRowSelected($event)"
      width="100%">
      <e-columns>
        <e-column field="liveVideoId" headerText="ID da Live (Instagram)" width="160"></e-column>
        <e-column field="status" headerText="Status" width="100"></e-column>
        <e-column field="startedAtFmt" headerText="Data da live" width="150"></e-column>
        <e-column field="totalComentarios" headerText="Comentários" width="110"></e-column>
        <e-column field="primeiroComentarioFmt" headerText="Primeiro comentário" width="150"></e-column>
      </e-columns>
    </ejs-grid>

    <div class="empty-state" *ngIf="!carregando && sessions.length === 0">
      Nenhuma sessão de live recebida ainda. Assim que o Instagram enviar o primeiro comentário via webhook, ela aparece aqui.
    </div>
  </div>
</div>
